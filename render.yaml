# Render.com deployment configuration
# Note: external Postgres (Neon) is used. DATABASE_URL is set manually in the
# Render dashboard (sync: false). Render's free managed Postgres was dropped
# because the free tier auto-deletes the DB after 30 days.

services:
  # Main CRM application (frontend + backend)
  - type: web
    name: crm-yahalom
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Bearer token used by AI agents (e.g. Hermes) to access the /mcp endpoint.
      # Auto-generated by Render; copy its value from the dashboard to the agent.
      - key: MCP_API_TOKEN
        generateValue: true
      - key: TZ
        value: Asia/Jerusalem
      # מראת Priority (מסך /priority, קריאה בלבד). ארבעתם נדרשים יחד —
      # חסר אחד והמסך מחזיר 503 מפורש במקום להיכשל בשקט.
      # הערכים נלקחים מ-priority-integration/dist-skill/tzevet-yahalom-crm/.env
      # (שם הם נקראים SUPABASE_URL / SUPABASE_ANON_KEY / HERMES_EMAIL / HERMES_PASSWORD).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PRIORITY_MIRROR_EMAIL
        sync: false
      - key: PRIORITY_MIRROR_PASSWORD
        sync: false
      - key: WAHA_API_URL
        value: https://crm-yahalom-waha.onrender.com
      - key: WAHA_WEBHOOK_URL
        value: https://crm-yahalom.onrender.com/api/integrations/whatsapp/webhook

  # WAHA - WhatsApp HTTP API (self-hosted WhatsApp bridge)
  - type: web
    name: crm-yahalom-waha
    env: docker
    dockerfilePath: ./Dockerfile.waha
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: WHATSAPP_DEFAULT_ENGINE
        value: NOWEB
      - key: WHATSAPP_RESTART_ALL_SESSIONS
        value: "true"
      - key: WAHA_WORKER_THREADS
        value: "1"
